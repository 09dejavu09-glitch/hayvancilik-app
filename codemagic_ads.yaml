workflows:
  android-apk:
    name: AHIR Android APK
    max_build_duration: 60

    environment:
      flutter: stable
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.example.ahir"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Check Flutter project
        script: |
          flutter doctor
          flutter analyze

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - "$CM_BUILD_EMAIL"
