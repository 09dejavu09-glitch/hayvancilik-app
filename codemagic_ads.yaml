workflows:
  android-build:
    name: Hayvancılık App Android
    environment:
      flutter: stable

    scripts:
      - name: Android klasörünü oluştur
        script: flutter create --platforms=android .

      - name: Çalışan main.dart dosyasını Flutter'a bağla
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: AdMob test App ID ekle
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          meta = '''        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-3940256099942544~3347511713"/>'''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              text = text.replace('</application>', meta + '\n    </application>', 1)
              manifest.write_text(text)
          PY

      - name: Paketleri yükle
        script: flutter pub get

      - name: APK oluştur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
