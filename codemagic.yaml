workflows:
  # Hatanın çözümü için buradaki ismi 'android-build' olarak geri değiştirdik.
  android-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Bağımlılıkları ve temizliği yap
        script: |
          flutter clean
          flutter pub get

      - name: Temiz Android projesi oluştur
        script: |
          rm -rf android
          flutter create --platforms=android .

      - name: AdMob App ID Inject
        script: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          ADMOB_ID="ca-app-pub-3940256099942544~3347511713"
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_ID\"/>" $MANIFEST_PATH

      - name: Gradle izinlerini ayarla
        script: |
          chmod +x android/gradlew

      - name: APK Derle
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
