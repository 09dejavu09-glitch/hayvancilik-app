workflows:
  android-build:
    name: AHIR Android

    environment:
      flutter: stable

    scripts:
      - name: Flutter sürümünü kontrol et
        script: flutter --version

      - name: Temiz Android projesi oluştur
        script: |
          rm -rf android
          flutter create --platforms=android .

      - name: Çalışan main.dart dosyasını bağla
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Paketleri yükle
        script: flutter pub get

      - name: APK oluştur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
