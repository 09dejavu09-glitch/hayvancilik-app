workflows:
  android-workflow:
    name: Android APK Oluştur
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths: [] # Önbelleği tamamen kapatır, dosya çakışmasını engeller
    scripts:
      - name: Paketleri al ve derle
        script: |
          #!/usr/bin/env bash
          set -e
          flutter pub get
          rm -rf android/.gradle
          rm -rf build
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ornek@email.com
        notify:
          failure: true
          success: true
          
