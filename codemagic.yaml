workflows:
  hayvancilik_android:
    name: Hayvancilik APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Flutter paketlerini yükle
        script: |
          flutter pub get

      - name: Android klasörünü oluştur
        script: |
          flutter create --platforms=android .

      - name: main.dart dosyasını kullan
        script: |
          cp main.dart lib/main.dart

      - name: APK oluştur
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
