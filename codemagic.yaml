workflows:
  android-build:
    name: AHIR Android

    environment:
      flutter: stable

    scripts:

      - name: Flutter sürümünü kontrol et
        script: flutter --version

      - name: Android projesini oluştur
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Gradle sürümünü AdMob ile uyumlu yap
        script: |
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i.bak 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Android Gradle Plugin sürümünü ayarla
        script: |
          if [ -f "android/settings.gradle" ]; then
            sed -i.bak -E 's/id "com.android.application" version "[^"]+"/id "com.android.application" version "8.7.3"/' android/settings.gradle
            sed -i.bak -E 's/id "com.android.library" version "[^"]+"/id "com.android.library" version "8.7.3"/' android/settings.gradle
          fi

      - name: Çalışan main.dart dosyasını bağla
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: AdMob App ID ekle
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          meta = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-3940256099942544~3347511713"/>"""

          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              text = text.replace(
                  "</application>",
                  meta + "\n    </application>",
                  1
              )
              manifest.write_text(text)
          PY

      - name: Paketleri yükle
        script: flutter pub get

      - name: APK oluştur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
