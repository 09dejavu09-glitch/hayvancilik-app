workflows:
  android-build:
    name: Hayvancılık App Android
    environment:
      flutter: stable

    scripts:
      - name: Android klasörünü oluştur
        script: flutter create --platforms=android .

      - name: APK oluştur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
