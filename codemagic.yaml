workflows:
  android-build:
    name: AHIR Android
    environment:
      flutter: stable

    scripts:
      - name: Hazir Android projesini ZIP'ten getir
        script: |
          rm -rf android
          rm -rf /tmp/ahir_project
          mkdir -p /tmp/ahir_project
          unzip -q hayvancilik-app-main-with-android.zip 'hayvancilik-app-main/android/*' -d /tmp/ahir_project
          cp -R /tmp/ahir_project/hayvancilik-app-main/android .

      - name: main.dart dosyasini Flutter'a bagla
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Paketleri yukle
        script: flutter pub get

      - name: APK olustur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
