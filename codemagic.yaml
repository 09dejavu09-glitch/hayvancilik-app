workflows:
  android-build:
    name: AHIR Android
    environment:
      flutter: stable
    scripts:
      - name: Android platformunu doğrula
        script: |
          flutter create --platforms=android .
      - name: AHIR ikonlarını geri yükle
        script: |
          if [ -f AHIR_ikon_paketi.zip ]; then
            unzip -o AHIR_ikon_paketi.zip -d android/app/src/main/res
          fi
      - name: Paketleri yükle
        script: flutter pub get
      - name: APK oluştur
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
