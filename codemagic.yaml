workflows:
  android-build:
    name: AHIR Android
    environment:
      flutter: stable

    scripts:
      - name: Android platform oluştur
        script: flutter create --platforms=android .

      - name: main.dart dosyasını lib içine kopyala
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Paketleri yükle
        script: flutter pub get

      - name: APK oluştur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
