workflows:
  android-build:
    name: AHIR Android

    environment:
      flutter: stable

    scripts:

      - name: Flutter sürümünü kontrol et
        script: |
          flutter --version

      - name: Android projesini oluştur
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Çalışan main.dart dosyasını Flutter'a bağla
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: AdMob App ID ekle
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text()

              meta = """        <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-3940256099942544~3347511713"/>"""

              if "com.google.android.gms.ads.APPLICATION_ID" not in text:
                  text = text.replace(
                      "</application>",
                      meta + "\n    </application>",
                      1
                  )
                  manifest.write_text(text)
          PY

      - name: Paketleri yükle
        script: |
          flutter pub get

      - name: APK oluştur
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
