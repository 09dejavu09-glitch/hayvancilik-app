workflows:
  android-workflow:
    name: Android APK Oluştur
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Paketleri al ve derle
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ornek@email.com
        notify:
          failure: true
          success: true
          
