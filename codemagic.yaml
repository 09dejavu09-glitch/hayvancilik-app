workflows:
  android-release:
    name: SigirTakip Android APK Derleme
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Eski Build Kalintilarini Temizle
        script: |
          rm -rf build android/app/build
          flutter clean
      - name: Paketleri Yukle
        script: |
          flutter pub get
      - name: APK Derle
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
