workflows:
  android-build:
    name: AHIR Android

    environment:
      flutter: stable

    scripts:
      - name: Android altyapısını ve ikonları hazırla
        script: |
          flutter create --platforms=android .
          unzip -o AHIR_ikon_paketi.zip -d android/app/src/main/res

      - name: Paketleri yükle
        script: |
          flutter pub get

      - name: APK oluştur
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
