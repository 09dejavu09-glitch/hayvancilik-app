workflows:
  android-workflow:
    name: Android APK Oluşturma Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: AHIR ikonlarını yerleştir ve bağımlılıkları al
        script: |
          flutter pub get
      - name: Önbellek Temizliği ve APK oluştur
        script: |
          #!/usr/bin/env bash
          set -e
          
          # Hata veren önbellek kalıntılarını siler
          flutter clean
          
          # Paketleri tekrar çeker
          flutter pub get
          
          # APK derleme komutu
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - user@example.com # E-posta adresiniz
        notify:
          failure: true
          success: true
          
