workflows:
  android-build:
    name: AHIR Android
    environment:
      flutter: stable

    scripts:
      - name: Android platform oluştur
        script: flutter create --platforms=android .

      - name: main.dart dosyasını Flutter'a bağla
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: AHIR ikonunu yerleştir
        script: |
          mkdir -p /tmp/ahir_icons
          unzip -o AHIR_ikon_paketi.zip -d /tmp/ahir_icons

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cp -R /tmp/ahir_icons/mipmap-mdpi android/app/src/main/res/
          cp -R /tmp/ahir_icons/mipmap-hdpi android/app/src/main/res/
          cp -R /tmp/ahir_icons/mipmap-xhdpi android/app/src/main/res/
          cp -R /tmp/ahir_icons/mipmap-xxhdpi android/app/src/main/res/
          cp -R /tmp/ahir_icons/mipmap-xxxhdpi android/app/src/main/res/

      - name: Paketleri yükle
        script: flutter pub get

      - name: APK oluştur
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
