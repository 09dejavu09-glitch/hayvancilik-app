workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter Temizliği ve Bağımlılıklar
        script: |
          flutter clean
          flutter pub get

      - name: AdMob App ID Inject
        script: |
          cat << 'EOF' > inject.py
          import os

          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              admob_tag = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>'
              if "APPLICATION_ID" not in content and "</application>" in content:
                  content = content.replace("</application>", f"{admob_tag}\n    </application>")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("AdMob ID eklendi.")
          EOF
          python3 inject.py

      - name: Gradle İzinlerini Ayarla
        script: |
          cd android && chmod +x gradlew

      - name: APK Derle
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
