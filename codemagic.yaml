workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Bağımlılıkları ve temizliği yap
        script: |
          flutter clean
          flutter pub get

      - name: Temiz Android projesi oluştur
        script: |
          rm -rf android
          flutter create --platforms=android .

      - name: AdMob App ID Inject
        script: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          admob_tag = '\''    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n</application>'\''
          if "APPLICATION_ID" not in content:
              content = content.replace("</application>", admob_tag)
              with open(path, "w") as f:
                  f.write(content)
          '

      - name: Gradle izinlerini ayarla
        script: |
          chmod +x android/gradlew

      - name: APK Derle
        script: |
          flutter build apk --release --no-tree-shake-icons

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
