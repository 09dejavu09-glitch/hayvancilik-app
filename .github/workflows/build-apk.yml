name: Hayvancılık APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
  # Ubuntu ortamında çalıştır
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android klasörünü ve yapılandırmasını oluştur
        run: |
          flutter create . --platforms=android --project-name ahir_app --org com.ornek

      - name: Kendi main.dart dosyamı kontrol et ve kopyala
        run: |
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

      - name: Paketleri yükle
        run: flutter pub get

      - name: APK oluştur
        run: flutter build apk --release

      - name: APK'yı sakla
        uses: actions/upload-artifact@v4
        with:
          name: hayvancilik-apk
          path: build/app/outputs/flutter-apk/app-release.apk
